
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mystery-story"
version = "0.1.0"
description = "AI-generated mystery story video generator"
requires-python = ">=3.12"
dependencies = [
    "edge-tts",
    "google-genai",
    "mutagen",
    "pillow",
    "python-dotenv",
    "streamlit",
    "vieneu",
]

[tool.setuptools.packages.find]
where = ["src"]
